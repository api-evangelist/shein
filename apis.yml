name: SHEIN
description: >-
  SHEIN is a global online fast-fashion and lifestyle retailer. For third-party
  sellers and logistics partners it operates the SHEIN Open Platform
  (open.sheincorp.com), a merchant-integration platform exposing OpenAPI and
  Webhook capabilities for product management (publishing listings),
  SHEIN-fulfilled and seller-fulfilled order management, logistics and shipping,
  and stock-preparation order fulfillment. Integration follows an
  application-and-review model: a partner applies for an Open Platform account,
  creates an application, passes review, completes seller authorization, then
  integrates the API solutions. The production API is served from
  openapi.sheincorp.com and requires authenticated, seller-authorized access.
  Developer contact is openapi@shein.com.
